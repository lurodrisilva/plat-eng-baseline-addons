# Values for the Kyverno admission policy engine addon.
# These nest under the `kyverno` dependency (chart 3.8.2 / app v1.18.2).
# Verify paths against the pinned chart's values.yaml before changing:
#   helm show values kyverno/kyverno --version 3.8.2
kyverno:
  # HA admission controller — a wedged single replica must not gate cluster admission.
  admissionController:
    replicas: 3
    container:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
  # Background controller processes existing resources for audit/PolicyReport.
  backgroundController:
    replicas: 1
    container:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
  reportsController:
    replicas: 1
  cleanupController:
    replicas: 1

  # CRD apply strategy for ArgoCD.
  # clusterpolicies.kyverno.io and policies.kyverno.io each ship a ~1.4MB OpenAPI
  # schema. ArgoCD's default client-side apply stashes the whole manifest in the
  # kubectl.kubernetes.io/last-applied-configuration annotation, which blows the
  # 262144-byte annotation limit — the apply fails, and because the app also sets
  # syncOptions Force=true, ArgoCD then deletes the CRD and fails to recreate it
  # (which silently drops every ClusterPolicy, guardrails included).
  # Replace=true switches ArgoCD to kubectl replace/create for these CRDs (no
  # last-applied annotation), so the large CRDs apply cleanly. This is the
  # Kyverno-documented ArgoCD install path (see the chart's crds.annotations note).
  crds:
    annotations:
      argocd.argoproj.io/sync-options: Replace=true
