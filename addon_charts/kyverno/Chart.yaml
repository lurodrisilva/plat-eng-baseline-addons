apiVersion: v2
name: kyverno
description: Admission policy engine (Kyverno) for the control plane cluster — guardrails-as-code

type: application

version: 0.2.0

appVersion: "1.14.5"

keywords:
  - Kyverno
  - Policy Engine
  - Admission Control
  - Guardrails
  - Control Plane System

dependencies:
  - name: kyverno
    # Stable 1.14 line: ships the clusterpolicies.kyverno.io CRD by default and
    # supports rule-level failureAction + failureActionOverrides. NOT 3.8.x/1.18 —
    # that line drops the ClusterPolicy CRD from the default install and the
    # admission controller crashloops on its sanity check.
    version: 3.4.6
    repository: https://kyverno.github.io/kyverno/
