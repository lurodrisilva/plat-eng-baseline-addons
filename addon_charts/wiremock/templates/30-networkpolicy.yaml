{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "wiremock.fullname" . }}-allow-consumers
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "wiremock.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "wiremock.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{ .Values.networkPolicy.consumerLabel }}: {{ .Values.networkPolicy.consumerLabelValue | quote }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
{{- end }}
