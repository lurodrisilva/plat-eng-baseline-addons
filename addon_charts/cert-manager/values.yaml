cert-manager:
  replicaCount: 2
  crds:
    enabled: true
  prometheus:
    enabled: false
  global:
    leaderElection:
      namespace: control-plane-system

  # Gateway API support is OFF by default in cert-manager and must be switched on
  # explicitly, or the HTTP-01 `gatewayHTTPRoute` solver never solves a challenge.
  # This cluster has no ingress controller at all — the front door is a Gateway
  # (ADR-0025) — so without this gate no certificate can ever be issued.
  #
  # This MUST be the top-level `featureGates` string, which the chart renders as a
  # `--feature-gates` CLI argument. Putting the same gate in the `config` block
  # (a ControllerConfiguration file, which the chart mounts and always passes via
  # `--config`) does NOT work: it was tried first, the gate was confirmed present
  # in the mounted ConfigMap, and the ACME solver still refused every challenge
  # with `couldn't Present challenge ...: gateway api is not enabled`. The solver
  # reads the CLI-populated gate registry, not the config file's.
  #
  # The failure mode is quiet in the worst way: cert-manager accepts the issuer,
  # creates the solver Pod and Service, and reports the Certificate as merely
  # "pending" — nothing surfaces until you read the Challenge's status.reason.
  featureGates: "ExperimentalGatewayAPISupport=true"

  # Deployment Section
  namespace: control-plane-system
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  podDisruptionBudget:
    enabled: true

  # Resources. These MUST stay nested under `cert-manager:` — this wrapper chart
  # has no templates/ of its own, so a `resources:` block at the top level of
  # this file is delivered to nothing and every cert-manager pod renders with no
  # requests at all. That is not a cosmetic omission on this cluster: a pod with
  # no CPU request is invisible to the scheduler's accounting, so it will happily
  # land on a node that is already the most requested one. Pinned by
  # tests/resources_test.yaml so the indentation cannot regress silently.
  #
  # The controller value keeps the 100m/100Mi this file always intended.
  resources:
    limits:
      cpu: 100m
      memory: 100Mi
    requests:
      cpu: 100m
      memory: 100Mi

  # cainjector and webhook are separate Deployments with their own keys, so the
  # controller's `resources` above does not reach them. cainjector caches CRDs
  # and Secrets to inject CA bundles, and its memory grows with the cluster, so
  # it gets headroom above its request rather than a limit equal to it.
  cainjector:
    resources:
      limits:
        cpu: 100m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 128Mi

  webhook:
    timeoutSeconds: 4
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi

# `startupapicheck` is deliberately left unset: it is a short-lived Job that
# exits once the API is answering, not a long-running Deployment, so it is not
# part of the steady-state footprint this file is sizing.

# ---------------------------------------------------------------------------
# ClusterIssuers for the platform origin (ADR-0025 / ADR-0026).
#
# Keys below this line belong to THIS wrapper chart, not to the cert-manager
# subchart — the templates/ directory added alongside this file reads them. Do
# not nest them under `cert-manager:`; that would hand them to the subchart,
# which knows nothing about them. (The inverse of the bug that made the
# `resources` block inert.)
# ---------------------------------------------------------------------------
issuers:
  # Both issuers are created together so switching is a one-line values change
  # rather than an edit under time pressure. ALWAYS prove the flow on staging
  # first: the production endpoint permits only 5 duplicate certificates per
  # week, and on this hostname the per-registered-domain budget is not even ours
  # (ADR-0026 — `cloudapp.azure.com` is absent from the Public Suffix List, so
  # the budget is `azure.com`'s and is shared with every other Azure tenant).
  enabled: true

  # Deliberately empty. Let's Encrypt treats the contact address as optional and
  # a personal address does not belong in a committed file. Set it per
  # environment if expiry notices are wanted.
  email: ""

  staging:
    name: letsencrypt-staging
    server: https://acme-staging-v02.api.letsencrypt.org/directory
  production:
    name: letsencrypt-prod
    server: https://acme-v02.api.letsencrypt.org/directory

  # The HTTP-01 solver routes the challenge through the shared platform Gateway.
  # There is no ingress controller on this cluster, so `ingress`-based solvers
  # cannot work, and DNS-01 is unavailable because the `cloudapp.azure.com` zone
  # is Microsoft's — we cannot publish its TXT records. HTTP-01 through the
  # Gateway is the only solver open to us, which also rules out wildcards.
  gateway:
    name: platform-origin
    namespace: control-plane-system
