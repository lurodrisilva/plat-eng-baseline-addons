global:
  control_plane: 
    namespace: control-plane-system
    project: addons-project
    repo: https://github.com/lurodrisilva/plat-eng-baseline-addons
    deployment: 
      limit: 5
      backoff:
        duration: 240s
        factor: 2
        maxDuration: 10m

resources:
  addon_name: resources
  enabled: false
  namespace: resources-system

# SUPERSEDED by crossplane_control_plane below — plat-eng-control-plane now owns every
# Crossplane API object (provider packages included), so these two never get enabled. They are
# kept only until their addon_charts/ are removed. Do not flip them on: their Provider CRs would
# duplicate the ones the control-plane chart installs, and two packages resolving the same
# dependency at different versions degrades the whole provider family.
providers:
  addon_name: providers
  enabled: false
  namespace: resources-system

# Also superseded. This chart's ProviderConfig is azure.m.upbound.io + SystemAssignedManagedIdentity
# with unfilled <SUBSCRIPTION_ID> placeholders; the control-plane chart ships the real one
# (ClusterProviderConfig, Secret-sourced from the Terraform-created service principal).
providers_config:
  addon_name: providers-config
  enabled: false
  namespace: resources-system

# The Crossplane control plane: provider packages, composition functions, the Azure credential
# binding, per-cluster network facts, and the platform's XRDs + Compositions. Sourced from
# plat-eng-control-plane so all of that versions together.
#
# ENABLED 2026-07-16. Both preconditions that held this back are met and were re-verified on
# aks-test before flipping:
#   1. plat-eng-control-plane#1 merged, so `path: chart` exists. Master now also carries the
#      Managed Redis engine (ADR-0019) and ships `redis.enabled: false`, so this app installs
#      the SQL API only — it will not try to create a cache Azure refuses to provision.
#   2. Safe Start is genuinely in force, not merely merged. The `crossplane` Application runs
#      with `provider.defaultActivations: []`, `managedresourceactivationpolicy default` returns
#      NotFound, and provider-azure-network sits at 1 Active MRD (privateendpoints, named by the
#      control plane's own policy) against 118 Inactive. That 1-vs-118 is the measurement that
#      matters: under the wildcard policy this chart activated ~238 resource definitions at once
#      and took the Free-tier API server offline, on 2026-07-16.
#
# Until this flip the control plane existed on aks-test only because it was applied by hand.
# Nothing reconciled it and nothing owned it, so it would not have survived a cluster rebuild —
# which is the whole point of the app-of-apps. ArgoCD adopts those objects on first sync
# (ServerSideApply, below).
crossplane_control_plane:
  addon_name: crossplane-control-plane
  enabled: true
  namespace: resources-system
  repo: https://github.com/lurodrisilva/plat-eng-control-plane
  targetRevision: HEAD
  path: chart
  valueFiles:
    - values.yaml
    # Network IDs are per-cluster and generated from terraform output. Swap this file when
    # pointing the app at another environment.
    - values-aks-test.yaml

backup: # not yet configured.
  addon_name: backup
  enabled: false
  namespace: backup-system

sample: # just a sample
  addon_name: sample
  enabled: false
  namespace: backup-system

karpenter: # not used for now, deployed thru terraform.
  addon_name: karpenter
  enabled: false
  namespace: karpenter

metrics_server:
  addon_name: metrics-server
  enabled: false
  namespace: control-plane-system

kube_state_metrics:
  addon_name: kube-state-metrics
  enabled: false
  namespace: control-plane-system

node_problem_detector:
  addon_name: node-problem-detector
  enabled: false
  namespace: control-plane-system

cert_manager:
  addon_name: cert-manager
  enabled: false
  namespace: control-plane-system

opentelemetry_operator: # Disabled to save resources.
  addon_name: opentelemetry-operator
  enabled: false
  namespace: control-plane-system

opentelemetry_collector: # Disabled to save resources.
  addon_name: opentelemetry-collector
  enabled: false
  namespace: control-plane-system

datadog_operator:
  addon_name: datadog-operator
  enabled: false
  namespace: control-plane-system

reloader:
  addon_name: reloader
  enabled: false
  namespace: control-plane-system

cluster_secret:
  addon_name: cluster-secret
  enabled: false
  namespace: control-plane-system

kube_cost:
  addon_name: kubecost
  enabled: false
  namespace: control-plane-system

observability:
  addon_name: observability
  enabled: false
  namespace: control-plane-system

cloudnative_pg:
  addon_name: cloudnative-pg
  enabled: false
  namespace: resources-system

azure_service_operator: 
  addon_name: azure-service-operator
  enabled: false
  namespace: resources-system

strimzi_operator:
  addon_name: strimzi-operator
  enabled: true
  namespace: messaging-system

k6_operator:
  addon_name: k6-operator
  enabled: true
  namespace: testing-system

# Shared WireMock mock server for test/preview tiers.
# WARNING: This addon ships HTTP mock responses with no built-in auth on the
# Admin API; access is gated by a NetworkPolicy that only admits namespaces
# labelled `wiremock.io/consumer=true`. Do NOT enable on a production cluster.
wiremock:
  addon_name: wiremock
  enabled: false
  namespace: testing-system

# External Secrets Operator — Azure Key Vault via Workload Identity.
# Azure-side glue (UAMI, federated credential, demo KV) is provisioned by
# the sibling Terraform repo 03-plat-eng-aks-foundation. After `make apply`
# there, paste the three outputs into the azure block below:
#   external_secrets_tenant_id            -> azure.tenant_id
#   external_secrets_uami_client_id       -> azure.workload_identity_client_id
#   external_secrets_keyvault_uri         -> azure.keyvault_uri
external_secrets:
  addon_name: external-secrets
  enabled: true
  namespace: control-plane-system
  azure:
    tenant_id: "8f77fb2e-7e77-477e-9a03-d078b7aad9c3"
    workload_identity_client_id: "b43ac0e5-c85b-4a26-b644-d3bf8797a38c"
    keyvault_uri: "https://eso-dev-c6f0b8.vault.azure.net/"

# Kyverno — admission policy engine (guardrails-as-code). See ADR-0011.
# Installs the engine + its CRDs at sync-wave 22. Disabled by default; the
# environment overlay enables it at cluster-apply time (audit-first is safe).
kyverno:
  addon_name: kyverno
  enabled: false
  namespace: kyverno

# Guardrail catalog (Kyverno ClusterPolicies) — applied at wave 23, one wave
# after the engine so the ClusterPolicy CRD exists. Slice 1 ships G1 only,
# audit-first fleet-wide with enforce scoped to the `guardrail-proof` namespace.
kyverno_guardrails:
  addon_name: kyverno-guardrails
  enabled: false
  namespace: kyverno
