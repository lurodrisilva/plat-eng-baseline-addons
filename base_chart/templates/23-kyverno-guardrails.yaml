---
{{- if (.Values.kyverno_guardrails.enabled) }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.kyverno_guardrails.addon_name }}
  namespace: {{ .Values.global.control_plane.namespace }}
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
    # One wave after the engine: the ClusterPolicy CRD must exist first.
    argocd.argoproj.io/sync-wave: "23"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.global.control_plane.project }}
  source:
    repoURL: {{ .Values.global.control_plane.repo }}
    targetRevision: HEAD
    path: {{ printf "addon_charts/%s" .Values.kyverno_guardrails.addon_name }}
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.kyverno_guardrails.namespace }}
  ignoreDifferences:
    # Kyverno's admission webhook defaults these fields onto every ClusterPolicy at
    # apply time. They are absent from the chart manifest, so ArgoCD sees the live
    # object as OutOfSync forever (selfHeal reapplies, the webhook re-adds them). The
    # policy is otherwise correct and Healthy — ignore the controller-owned defaults.
    - group: kyverno.io
      kind: ClusterPolicy
      jqPathExpressions:
        - .spec.admission
        - .spec.emitWarning
        - .spec.validationFailureAction
        # skipBackgroundRequests is a rule-level field (NOT under .validate).
        - .spec.rules[].skipBackgroundRequests
        - .spec.rules[].validate.allowExistingViolations
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - Validate=false
      - Prune=true
      - ApplyOutOfSyncOnly=true
      - Force=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      # Consistent with the engine app; harmless for the small ClusterPolicy CR.
      - ServerSideApply=true
    {{- with .Values.global.control_plane.deployment }}
    retry:
      limit: {{ .limit }}
      backoff:
        duration: {{ .backoff.duration }}
        factor: {{ .backoff.factor }}
        maxDuration: {{ .backoff.maxDuration }}
    {{- end }}
{{- end }}
